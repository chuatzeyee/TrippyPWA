<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1B1A17">
  <meta name="description" content="Trippy - AI-powered travel planning that feels like a journal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Trippy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://flagcdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/nav.css">
  <link rel="stylesheet" href="/css/components/dashboard.css">
  <link rel="stylesheet" href="/css/components/wizard.css">
  <link rel="stylesheet" href="/css/components/modal.css">
  <link rel="stylesheet" href="/css/components/auth.css">
  <link rel="stylesheet" href="/css/components/trip-detail.css">
  <link rel="stylesheet" href="/css/components/profile-wizard.css">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
</head>
<body>
  <nav id="app-nav"></nav>
  <main id="app">
    <div class="dashboard container" id="app-shell">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px;">
        <svg class="app-shell-plane" width="40" height="40" viewBox="0 0 24 24" fill="var(--terracotta, #EA580C)"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        <div style="display:flex;gap:6px;">
          <span class="app-shell-dot"></span>
          <span class="app-shell-dot" style="animation-delay:0.15s"></span>
          <span class="app-shell-dot" style="animation-delay:0.3s"></span>
        </div>
      </div>
    </div>
    <style>
      .app-shell-plane{animation:shellFloat 2s ease-in-out infinite}
      .app-shell-dot{width:6px;height:6px;border-radius:50%;background:rgba(229,225,216,0.2);animation:shellPulse 1.2s ease-in-out infinite}
      @keyframes shellFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes shellPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
    </style>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
